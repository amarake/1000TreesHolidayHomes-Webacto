<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Site Visit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-blue-600 px-8 py-6 text-white">
      <h1 class="text-2xl font-bold">Book a Site Visit</h1>
      <p class="text-blue-100 mt-1 text-sm">Fill in your details and our team will confirm your visit.</p>
    </div>

    <form id="siteVisitForm" class="px-8 py-6 space-y-5" novalidate>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name <span class="text-red-500">*</span></label>
          <input type="text" id="name" name="name" required
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Your name" />
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone <span class="text-red-500">*</span></label>
          <input type="tel" id="phone" name="phone" required pattern="[0-9+\-\s]{10,15}"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="98765 43210" />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" name="email"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="you@example.com" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="project" class="block text-sm font-medium text-slate-700 mb-1">Project / Property <span class="text-red-500">*</span></label>
          <select id="project" name="project" required
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select a project</option>
            <option>1 BHK Apartment</option>
            <option>2 BHK Apartment</option>
            <option>3 BHK Apartment</option>
            <option>Villa</option>
            <option>Plot</option>
            <option>Commercial</option>
          </select>
        </div>
        <div>
          <label for="budget" class="block text-sm font-medium text-slate-700 mb-1">Budget</label>
          <select id="budget" name="budget"
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select budget</option>
            <option>Under 25 Lakh</option>
            <option>25 - 50 Lakh</option>
            <option>50 Lakh - 1 Cr</option>
            <option>Above 1 Cr</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="visitDate" class="block text-sm font-medium text-slate-700 mb-1">Preferred Date <span class="text-red-500">*</span></label>
          <input type="date" id="visitDate" name="visitDate" required
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="visitTime" class="block text-sm font-medium text-slate-700 mb-1">Preferred Time <span class="text-red-500">*</span></label>
          <select id="visitTime" name="visitTime" required
            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select time slot</option>
            <option>10:00 AM - 12:00 PM</option>
            <option>12:00 PM - 02:00 PM</option>
            <option>02:00 PM - 04:00 PM</option>
            <option>04:00 PM - 06:00 PM</option>
          </select>
        </div>
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-slate-700 mb-1">Message</label>
        <textarea id="message" name="message" rows="3"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Any specific requirement?"></textarea>
      </div>

      <p id="formError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2"></p>

      <button type="submit" id="submitBtn"
        class="w-full flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed transition">
        <svg id="spinner" class="hidden h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span id="btnText">Book Site Visit</span>
      </button>
    </form>
  </div>

  <script>
    // ============ CONFIG ============
    // Apna webhook URL yaha paste karo (Zapier / Make / n8n / Pabbly / Google Apps Script etc.)
    const WEBHOOK_URL = "https://your-webhook-url-here";

    // Success ke baad kis page pe redirect karna hai
    const THANK_YOU_URL = "thank-you.html";

    // "json"  -> application/json body bhejega
    // "form"  -> application/x-www-form-urlencoded (agar webhook pe CORS error aaye to ye use karo)
    const SEND_AS = "json";
    // ================================

    const form = document.getElementById("siteVisitForm");
    const submitBtn = document.getElementById("submitBtn");
    const spinner = document.getElementById("spinner");
    const btnText = document.getElementById("btnText");
    const formError = document.getElementById("formError");

    // Past dates block karo
    document.getElementById("visitDate").min = new Date().toISOString().split("T")[0];

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.remove("hidden");
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      spinner.classList.toggle("hidden", !loading);
      btnText.textContent = loading ? "Submitting..." : "Book Site Visit";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.classList.add("hidden");

      if (!form.checkValidity()) {
        const firstInvalid = form.querySelector(":invalid");
        firstInvalid.focus();
        showError("Please fill all required fields correctly.");
        return;
      }

      if (!WEBHOOK_URL || WEBHOOK_URL.includes("your-webhook-url-here")) {
        showError("Webhook URL is not configured. Set WEBHOOK_URL in index.html.");
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());
      data.submittedAt = new Date().toISOString();
      data.pageUrl = window.location.href;

      const options =
        SEND_AS === "form"
          ? {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams(data).toString(),
            }
          : {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            };

      setLoading(true);
      try {
        const res = await fetch(WEBHOOK_URL, options);
        if (!res.ok) throw new Error("Server responded with " + res.status);

        sessionStorage.setItem("siteVisitName", data.name);
        window.location.href = THANK_YOU_URL;
      } catch (err) {
        console.error(err);
        showError("Something went wrong. Please try again.");
        setLoading(false);
      }
    });
  </script>
</body>
</html>
