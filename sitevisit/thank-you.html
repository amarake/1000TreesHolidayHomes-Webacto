<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | 1000 Trees Dapoli</title>
  <link rel="icon" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', "sans-serif"] },
          colors: { brand: { DEFAULT: "#03623f", dark: "#024a30" } },
        },
      },
    };
  </script>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4 bg-cover bg-center bg-fixed"
  style="background-image: url('../assets/images/background.webp');">

  <div class="fixed inset-0 bg-black/50 backdrop-blur-md"></div>

  <div class="relative w-full max-w-md rounded-[2rem] border border-white/15 bg-neutral-900/60 backdrop-blur-2xl shadow-2xl shadow-black/50 px-8 py-10 text-center">
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-brand shadow-lg shadow-brand/40">
      <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1 class="text-3xl font-bold tracking-tight text-white">Thank You<span id="userName"></span>!</h1>
    <p class="mt-3 text-white/60">Your site visit request has been received. Our team will call you shortly to confirm your visit.</p>
    <a href="../"
      class="mt-8 inline-block rounded-full bg-brand px-8 py-3.5 font-bold text-white shadow-lg shadow-brand/30 transition hover:bg-brand-dark">
      Back to Home
    </a>
  </div>

  <script>
    const name = sessionStorage.getItem("siteVisitName");
    if (name) {
      document.getElementById("userName").textContent = ", " + name;
      sessionStorage.removeItem("siteVisitName");
    }
  </script>
</body>
</html>
