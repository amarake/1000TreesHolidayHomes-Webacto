<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-green-100">
      <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-800">Thank You<span id="userName"></span>!</h1>
    <p class="mt-3 text-slate-600">Your site visit request has been received. Our team will contact you shortly to confirm the visit.</p>
    <a href="index.html"
      class="mt-6 inline-block rounded-lg bg-blue-600 px-6 py-2.5 font-semibold text-white hover:bg-blue-700 transition">
      Back to Home
    </a>
  </div>

  <script>
    const name = sessionStorage.getItem("siteVisitName");
    if (name) {
      document.getElementById("userName").textContent = ", " + name;
      sessionStorage.removeItem("siteVisitName");
    }
  </script>
</body>
</html>
